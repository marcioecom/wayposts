name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/wayposts
  SHA: ${{ github.sha }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-kubectl@v4

      - name: Render k8s manifests
        env:
          WAYPOSTS_IMAGE: ghcr.io/${{ github.repository_owner }}/wayposts
          WAYPOSTS_TAG: ${{ github.sha }}
        run: |
          kubectl kustomize deploy/k8s/overlays/orbit \
            | envsubst '${WAYPOSTS_IMAGE} ${WAYPOSTS_TAG}' \
            > /dev/null
          envsubst < deploy/k8s/base/migrate-job.yaml > /dev/null

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - name: Check deploy script
        run: bash -n scripts/k8s-apply.sh

      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the web console
        working-directory: web
        env:
          VITE_API_URL: https://wayposts-api.marcio.run
        run: |
          npm ci
          npm run build

  build:
    needs: verify
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.SHA }}
            ${{ env.IMAGE }}:dev
          cache-from: type=gha,scope=wayposts
          cache-to: type=gha,mode=max,scope=wayposts

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Join tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      - uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_BASE64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy
        env:
          WAYPOSTS_IMAGE: ${{ env.IMAGE }}
          WAYPOSTS_TAG: ${{ env.SHA }}
        run: bash scripts/k8s-apply.sh
