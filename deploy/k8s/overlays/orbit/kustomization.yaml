apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# O CI e o script de apply trocam os placeholders pela imagem e pelo SHA.
images:
  - name: ghcr.io/marcioecom/wayposts
    newName: ${WAYPOSTS_IMAGE}
    newTag: ${WAYPOSTS_TAG}

# Todo o stack cabe em um nó só para o smoke de 1:1000. Helsinki é o worker
# com mais folga de requests (o de Falkenstein está em ~89% de CPU).
patches:
  - target:
      kind: Deployment
      namespace: wayposts
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ignored
      spec:
        template:
          spec:
            nodeSelector:
              topology.kubernetes.io/region: hel1
            imagePullSecrets:
              - name: ghcr-pull-secret
  - target:
      kind: Cluster
      namespace: wayposts
    patch: |-
      apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      metadata:
        name: ignored
      spec:
        affinity:
          nodeSelector:
            topology.kubernetes.io/region: hel1
