apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# A imagem é construída localmente e enviada ao GHCR (ver README).
images:
  - name: ghcr.io/marcioecom/wayposts
    newTag: dev

# Todo o stack cabe em um nó só para o smoke de 1:1000. Helsinki é o worker
# com mais folga de requests (o de Falkenstein está em ~89% de CPU).
patches:
  - target:
      kind: Deployment
      namespace: wayposts
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ignored
      spec:
        template:
          spec:
            nodeSelector:
              topology.kubernetes.io/region: hel1
  - target:
      kind: Job
      namespace: wayposts
    patch: |-
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: ignored
      spec:
        template:
          spec:
            nodeSelector:
              topology.kubernetes.io/region: hel1
  - target:
      kind: Cluster
      namespace: wayposts
    patch: |-
      apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      metadata:
        name: ignored
      spec:
        affinity:
          nodeSelector:
            topology.kubernetes.io/region: hel1
