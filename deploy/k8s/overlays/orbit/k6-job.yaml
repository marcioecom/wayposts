# Gerador de carga dentro do cluster: o tráfego não passa pela WAN e a
# latência medida é a do serviço, não a do Tailscale.
#
# A imagem é construída de deploy/k6/Dockerfile. Este Job usa nome fixo. Para
# rodar de novo, delete antes com `kubectl delete job k6 -n wayposts`.
apiVersion: batch/v1
kind: Job
metadata:
  name: k6
  namespace: wayposts
  labels:
    app.kubernetes.io/name: k6
    app.kubernetes.io/part-of: wayposts
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 3600
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k6
        app.kubernetes.io/part-of: wayposts
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-pull-secret
      # Nó dedicado ao gerador, fora do nó do stack. A label e a taint são
      # criadas fora do repositório; ver deploy/k8s/README.md.
      nodeSelector:
        wayposts.io/loadgen: "true"
      tolerations:
        - key: wayposts.io/loadgen
          operator: Equal
          value: "true"
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 12345
        runAsGroup: 12345
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: k6
          image: ghcr.io/marcioecom/wayposts-k6:dev
          # A tag dev pode existir apenas no containerd do nó (import manual).
          # Reimporte a imagem e recrie o Job para medir a versão nova.
          imagePullPolicy: IfNotPresent
          args: ["run", "/load/steady.js"]
          env:
            - name: BASE
              value: http://gateway:8080
            - name: USERS
              value: "20000"
            - name: CELEBS
              value: "3"
            - name: RATE
              value: "50"
            - name: DURATION
              value: "3m"
            - name: ENFORCE
              value: "1"
          resources:
            # Em runs de 1.000+ VUs o k6 passa de 512Mi e o limite de 1 CPU
            # vira o gargalo. O nó dedicado tem 4Gi de memória.
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
