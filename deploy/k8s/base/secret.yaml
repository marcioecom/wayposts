# Credenciais do laboratório. NÃO use estes valores em produção: troque a
# senha do Postgres e do RabbitMQ antes de aplicar, e mantenha o secret fora
# do controle de versão em um cluster compartilhado.
#
# A senha do Postgres aparece em um único lugar: o CNPG usa este mesmo secret
# para o bootstrap e os serviços montam DATABASE_URL com $(POSTGRES_PASSWORD).
apiVersion: v1
kind: Secret
metadata:
  name: wayposts-db
  namespace: wayposts
type: kubernetes.io/basic-auth
stringData:
  username: wayposts
  password: wayposts-lab
---
apiVersion: v1
kind: Secret
metadata:
  name: wayposts-rabbit
  namespace: wayposts
type: Opaque
stringData:
  username: wayposts
  password: wayposts-lab
  erlang-cookie: wayposts-lab-cookie
