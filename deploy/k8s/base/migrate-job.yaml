# Migrations rodam uma vez por apply. O SQL é idempotente, mas o livro
# schema_migrations não é: por isso é um Job único, não um initContainer em
# cada serviço.
apiVersion: batch/v1
kind: Job
metadata:
  name: wayposts-migrate
  namespace: wayposts
  labels:
    app.kubernetes.io/name: migrate
    app.kubernetes.io/part-of: wayposts
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migrate
        app.kubernetes.io/part-of: wayposts
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ${WAYPOSTS_IMAGE}:${WAYPOSTS_TAG}
          command: ["/usr/local/bin/migrate"]
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wayposts-db
                  key: password
            - name: DATABASE_URL
              value: postgres://wayposts:$(POSTGRES_PASSWORD)@wayposts-postgres-rw:5432/wayposts?sslmode=require
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
