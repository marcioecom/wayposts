apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: wayposts

resources:
  - namespace.yaml
  - config.yaml
  - secret.yaml
  - data.yaml
  - apps.yaml
  - monitoring.yaml

# O Job de migration é aplicado separadamente, antes dos Deployments, pelo
# workflow e por scripts/k8s-apply.sh. Ele não entra no kustomize para não ser
# recriado junto com o rollout dos serviços.
